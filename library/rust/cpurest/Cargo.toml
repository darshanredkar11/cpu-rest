[package]
name = "cpurest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/REST ergonomics at shared-memory speed: typed routing and a typed client over cpurest-core's POSIX shm transport."

[dependencies]
cpurest-core = { path = "../cpurest-core" }
cpurest-macros = { path = "../cpurest-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-executor = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
