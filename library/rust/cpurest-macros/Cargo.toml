[package]
name = "cpurest-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc-macro attribute routing DSL (#[cpu_get], #[cpu_post], ...) for cpurest."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
